<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="css/menu.css">
        <title>Google Chrome</title>
    </head>
    <body>
        <header>
            <img src="img/home.svg" width="20px" height="20px">
            <div id="informations">
                <img src="img/circle-user.svg" width="20px" height="20px">
                <img src="img/menu-dots-vertical.svg" width="20px" height="20px">
            </div>
        </header>

        <main>
            <h1>Google</h1>
            <div id="input-text">
                <strong>G</strong>
                <input type="text" placeholder="Pesquise no Google ou digite uma URL">
                <img src="img/clip.svg" width="20px" height="20px">
                <img src="img/lupa-de-impressao-digital.svg" width="20px" height="20px">
            </div>

            <div id="infoPlus">
                <button class="btn-info"><img src="img/magnifying-glass-wave.svg" width="20px" height="20px">Modo IA</button>
                <button class="btn-info"><img src="img/estampas-de-sapatos.svg" width="20px" height="20px">Modo anônimo</button>
            </div>

            <form id="navegation">
                <div id="box-nav">
                    <button class="card">card 1</button>
                    <button class="card">card 2</button>
                    <button class="card">card 3</button>
                    <button class="card">card 4</button>
                    <button class="card">card 5</button>
                    <button class="card">card 6</button>
                    <button class="card">card 7</button>
                    <button class="card">card 8</button>
                    <button class="card">card 9</button>
                    <button class="card">card 10</button>

                </div>
            </form>
        </main>

        <aside>
            <div class="ad">
                <div class="ad-img">
                    <img src="img/galeria.svg" width="50px" height="50px">
                </div>
                <div class="ad-head">
                    <div class="link">
                        <p>Informações de Notícia</p>
                    </div>
                    <div class="ad-footer">
                        <nav>conteudo nome</nav>
                        <div class="ad-gap"> 
                            <img src="img/compartilhar.svg" width="15px" height="15px";> <img src="img/menu-dots-vertical.svg" width="15px" height="15px">
                        </div>
                    </div>
                </div>
            </div>
        </aside>
        <script src="js/menu.js" defer></script>
    </body>
</html>
